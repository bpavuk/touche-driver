[package]
name = "touche-lib"
version = "0.4.0"
edition = "2024"

[dependencies]
futures-lite = "2.6.0"
mio = "1.0.3"
env_logger = "0.11.8"
log = "0.4.29"
chrono = "0.4.42"
serde = { version = "1.0.223", features = ["derive"] }
serde_cbor = "0.11.2"
thiserror = "2.0.16"

touche-aoa = { path = "../touche-aoa" }

[target.'cfg(unix)'.dependencies]
evdev = "0.13.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.0", features = ["UI_Input_Preview_Injection"] }
