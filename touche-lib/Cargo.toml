[package]
name = "touche-lib"
version = "0.4.0"
edition = "2024"

[dependencies]
futures-lite = "2.6.1"
mio = "1.1.1"
env_logger = "0.11.9"
log = "0.4.29"
chrono = "0.4.43"
serde = { version = "1.0.228", features = ["derive"] }
serde_cbor = "0.11.2"
thiserror = "2.0.18"

touche-aoa = { path = "../touche-aoa" }

[target.'cfg(unix)'.dependencies]
evdev = "0.13.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["UI_Input_Preview_Injection"] }
